name: AutoArmor - approved release v1.0.0

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-trigger-v1.0.0'

permissions:
  contents: write
  actions: write

concurrency:
  group: publish-autoarmor-v1.0.0
  cancel-in-progress: false

jobs:
  verify-tag-publish:
    if: contains(github.event.head_commit.message, 'Publish approved AutoArmor v1.0.0')
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved AutoArmor
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify approved runtime files
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^## Version: 1.0.0$' AutoArmor.toc
          test ! -e Profiles.lua
          sha256sum -c tests/approved-1.0.0.sha256

      - name: Install Lua test runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y liblua5.4-0

      - name: Run regression scenarios
        run: python3 tests/run.py

      - name: Create approved version tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          if git rev-parse --verify -q refs/tags/v1.0.0 >/dev/null; then
            echo 'Refusing duplicate publication: tag already exists'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a v1.0.0 -m 'AutoArmor v1.0.0 - owner-approved'
          git push origin refs/tags/v1.0.0

      - name: Publish approved release through the existing release pipeline
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref v1.0.0 -f publish=true
