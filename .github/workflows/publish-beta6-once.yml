name: AutoArmor - Publication unique de la beta 0.7.3.6

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-trigger-v0.7.3-beta.6'

permissions:
  contents: write
  actions: write

jobs:
  preparer-et-publier:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer la version approuvee
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verifier le contenu valide
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^## Version: 0.7.3-beta.6$' AutoArmor.toc
          grep -q 'AA.version = "0.7.3-beta.6"' Core.lua
          test "$(git hash-object AutoArmor.toc)" = "5281ac9c73536c42520bbb88adcb5a0150ae602e"
          test "$(git hash-object Core.lua)" = "bd984ff3ac7e99e94209f1a115988a5a63f72441"
          test "$(git hash-object Buttons.lua)" = "9a14601d6e3d873fbe841717a7b3ce2aa134efc8"
          test "$(git hash-object Textures/AutoArmorIcon.tga)" = "edc186d8e40f8b47c8c56a1f24cc9dd36d88c7e8"
          test "$(git hash-object Textures/AutoArmorListIcon.tga)" = "dfaf1838c8b329dbb4047c7653a10bdb5d5b07cf"
          echo "Version ZIP testee reconnue; hash correct."

      - name: Creer le tag de version
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          if git rev-parse --verify -q refs/tags/v0.7.3-beta.6 >/dev/null; then
            echo "Ce tag existe deja. Publication interrompue pour eviter un doublon."
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.7.3-beta.6 -m "AutoArmor v0.7.3-beta.6 - validation utilisateur"
          git push origin refs/tags/v0.7.3-beta.6

      - name: Demarrer la publication CurseForge depuis le tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref v0.7.3-beta.6 -f publish=true
