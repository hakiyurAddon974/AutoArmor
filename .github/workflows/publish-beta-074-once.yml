name: AutoArmor - publication unique v0.7.4-beta.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-trigger-v0.7.4-beta.1'

permissions:
  contents: write
  actions: write

jobs:
  preparer-et-publier:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout approved code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tested ZIP source hashes
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^## Version: 0.7.4-beta.1$' AutoArmor.toc
          grep -q 'Locale.lua' AutoArmor.toc
          test "$(git hash-object 'AutoArmor.toc')" = "2a191a5ae776c4b7e1d9630216bd8a14f0260be0"
          test "$(git hash-object 'Buttons.lua')" = "c4ac60c7a8d8a1abefb82734ceb15da55577c650"
          test "$(git hash-object 'Core.lua')" = "6ff8223112758df7bb52d97d0e8e80772213ac3e"
          test "$(git hash-object 'Database.lua')" = "f1f279e9c471d95e24e52e4791cc8e5bb60e98e3"
          test "$(git hash-object 'Diagnostic.lua')" = "ce4b952197d0be7cf41dca4342ed7c1145ae98b0"
          test "$(git hash-object 'Equipment.lua')" = "bc239979e4cc4766ff8bfed951941348415125ad"
          test "$(git hash-object 'History.lua')" = "1247dc5f2224fa2b03416fa61d61cf3f15f67928"
          test "$(git hash-object 'Locale.lua')" = "31ffd8aa250c2cc3ffa47807a4d2d0ac8546baaf"
          test "$(git hash-object 'Notifications.lua')" = "870885e6d1a174bf26fc3d736ee46c9a5bf56fa7"
          test "$(git hash-object 'Protection.lua')" = "03b9a5003a02947fb02a0b33f1d8e33ffbaf5106"
          test "$(git hash-object 'Quest.lua')" = "07e1b584c845c4273178c6057cdfadd3a25a0eb5"
          test "$(git hash-object 'Restore.lua')" = "cc886a890ba7fb50d50985edd5ac1347b3a757f2"
          test "$(git hash-object 'UI.lua')" = "e79826bfa11ebb696a3236a2fff6361f9c52d2e4"
          test "$(git hash-object 'Undo.lua')" = "8b2d646890ce223a3701dc035930eb07ecebedf5"
          echo 'All 14 files match the tested ZIP'

      - name: Create version tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          if git rev-parse --verify -q refs/tags/v0.7.4-beta.1 >/dev/null; then
            echo 'Tag already exists; aborting to avoid duplicates'
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.7.4-beta.1 -m "AutoArmor v0.7.4-beta.1 - bilingual localization approved by user"
          git push origin refs/tags/v0.7.4-beta.1

      - name: Trigger CurseForge publish
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref v0.7.4-beta.1 -f publish=true
