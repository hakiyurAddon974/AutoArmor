name: AutoArmor - approved release v0.7.5-beta.3

on:
  push:
    branches:
      - main
    paths:
      - '.github/release-trigger-v0.7.5-beta.3'

permissions:
  contents: write
  actions: write

jobs:
  verify-tag-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out approved AutoArmor
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tested v0.7.5-beta.3 source hashes
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^## Version: 0.7.5-beta.3$' AutoArmor.toc
          grep -q 'WeaponPlan.lua' AutoArmor.toc
          test "$(git hash-object 'AutoArmor.toc')" = "b8cec19bae54921bd09466711350a504d426200b"
          test "$(git hash-object 'Core.lua')" = "61631e384aa37b4b97f2b65a516fa69d9b33139b"
          test "$(git hash-object 'Database.lua')" = "f38f2492eb22d4470bc036e512cb63655563d046"
          test "$(git hash-object 'Diagnostic.lua')" = "a0ebb6b55ddf2a461762b7b0beb118859c02b348"
          test "$(git hash-object 'History.lua')" = "2d719fc6ea2c008fe4406e2e6466bff1351c4206"
          test "$(git hash-object 'Locale.lua')" = "75902260f24572d9dd3d1640e8ea0f4fb5b69621"
          test "$(git hash-object 'Notifications.lua')" = "487b3eb0c49e6fe4588a66ebc0d5097bf9b7cd67"
          test "$(git hash-object 'Profiles.lua')" = "84fa8dd5edfaf53edd0195b854222e1230ccaa9b"
          test "$(git hash-object 'Scanner.lua')" = "bef09116235e64ef6326d7020a6458aef7e193eb"
          test "$(git hash-object 'UI.lua')" = "9a18501f34f14b89adca031ef3533503e4c76105"
          test "$(git hash-object 'WeaponPlan.lua')" = "c3b69053dc5c15ccf7d1266630c386f4f2373793"
          test -f Textures/AutoArmorIcon.tga
          test -f Textures/AutoArmorListIcon.tga
          echo "All 11 changed files exactly match the approved ZIP."

      - name: Create approved version tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags
          if git rev-parse --verify -q refs/tags/v0.7.5-beta.3 >/dev/null; then
            echo "Refusing duplicate publication: tag already exists"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v0.7.5-beta.3 -m "AutoArmor v0.7.5-beta.3 - owner-approved"
          git push origin refs/tags/v0.7.5-beta.3

      - name: Publish approved beta on CurseForge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref v0.7.5-beta.3 -f publish=true
