name: Publier AutoArmor sur CurseForge

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publication:
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Construire et publier le ZIP
        uses: BigWigsMods/packager@v2
        with:
          args: -p 1800518
