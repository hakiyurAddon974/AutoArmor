name: Publier AutoArmor sur CurseForge

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verification:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verifier les fichiers de l'addon
        shell: bash
        run: |
          test -f AutoArmor.toc
          test -f Textures/AutoArmorIcon.tga
          test -f Textures/AutoArmorButton.tga
          test -f .pkgmeta
          echo 'Structure AutoArmor valide'

  publication:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Construire et publier le ZIP
        uses: BigWigsMods/packager@v2
        with:
          args: -p 1800518
