name: Publier AutoArmor sur CurseForge

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  verification:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verifier les fichiers de l'addon
        shell: bash
        run: |
          test -f AutoArmor.toc
          test -f Textures/AutoArmorIcon.tga
          test -f Textures/AutoArmorButton.tga
          test -f .pkgmeta
          echo 'Structure AutoArmor valide'

      - name: Construire le ZIP sans publier
        uses: BigWigsMods/packager@v2
        with:
          args: -d

      - name: Verifier la creation du ZIP
        shell: bash
        run: |
          ls -lah .release/
          find .release -maxdepth 1 -type f -name '*.zip' -print
          compgen -G '.release/*.zip' > /dev/null || { echo "ERREUR : aucun ZIP genere par le packager."; exit 1; }

      - name: Conserver le ZIP de test
        uses: actions/upload-artifact@v7
        with:
          name: AutoArmor-ZIP-test
          path: .release/*.zip
          include-hidden-files: true
          if-no-files-found: error

  publication:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
      GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Construire et publier le ZIP sur CurseForge
        uses: BigWigsMods/packager@v2
        with:
          args: -p 1800518
